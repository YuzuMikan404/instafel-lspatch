name: Auto Patch Instafel (Local Mode)

on:
  schedule:
    # 毎日 日本時間 午前4時 (UTC 19:00) にチェック
    - cron: '0 19 * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

jobs:
  check-and-patch:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Javaのセットアップ
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Android SDKのセットアップ
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platform-tools"

      # 4. 更新チェック
      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: "mamiiblt/instafel"
        run: |
          # 最新のInstafelのタグを取得
          LATEST_TAG=$(gh release list --repo "$UPSTREAM_REPO" --limit 1 --json tagName --jq '.[0].tagName')
          echo "Upstream version: $LATEST_TAG"

          # 自分のリポジトリの最新リリースを取得
          CURRENT_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || echo "")
          echo "Current local version: $CURRENT_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "Error: Could not find upstream release."
            exit 1
          fi

          if [ "$LATEST_TAG" == "$CURRENT_TAG" ]; then
            echo "Already up to date."
            echo "update_needed=false" >> $GITHUB_OUTPUT
          else
            echo "New version found!"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "upstream_repo=$UPSTREAM_REPO" >> $GITHUB_OUTPUT
          fi

      # 5. Instafel APKのダウンロード
      - name: Download Instafel APK
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ steps.check.outputs.upstream_repo }}
          TAG_NAME: ${{ steps.check.outputs.tag_name }}
        run: |
          echo "Fetching asset list for $TAG_NAME..."

          ASSET_LIST=$(gh release view "$TAG_NAME" --repo "$UPSTREAM_REPO" --json assets --jq '.assets[].name | select(endswith(".apk"))')
          echo "Found assets:"
          echo "$ASSET_LIST"

          # Clone版 ('instafel_c_') を検索して抽出
          TARGET_FILE=$(echo "$ASSET_LIST" | grep "instafel_c_" | head -n 1)

          if [ -z "$TARGET_FILE" ]; then
            echo "Warning: Clone version (instafel_c_) not explicitly found."
            echo "Falling back to the first available apk."
            TARGET_FILE=$(echo "$ASSET_LIST" | head -n 1)
          fi

          echo "Selected target file: $TARGET_FILE"

          gh release download "$TAG_NAME" --repo "$UPSTREAM_REPO" --pattern "$TARGET_FILE" --output "instafel.apk" --clobber
          ls -lh instafel.apk

      # 6. LSPatch (JingMatrix版) のダウンロード
      - name: Download LSPatch (JingMatrix)
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LSPATCH_REPO: "JingMatrix/LSPatch"
        run: |
          echo "Downloading latest LSPatch resources from $LSPATCH_REPO..."
          LATEST_LSPATCH_TAG=$(gh release list --repo "$LSPATCH_REPO" --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$LATEST_LSPATCH_TAG" ]; then
            echo "Error: Could not find LSPatch release."
            exit 1
          fi

          echo "LSPatch version: $LATEST_LSPATCH_TAG"

          # --- .jar ダウンロード ---
          # 複数ヒットに備えて1ファイルだけ選択してダウンロード
          JAR_FILE=$(gh release view "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --json assets \
            --jq '.assets[].name | select(endswith(".jar"))' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Error: No .jar asset found in LSPatch release."
            exit 1
          fi

          echo "Selected jar: $JAR_FILE"
          gh release download "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --pattern "$JAR_FILE" --output "lspatch.jar" --clobber

          # --- Manager APK ダウンロード ---
          # .apk が複数ある場合に備え、"manager" を含むファイルを優先して1つだけ選択
          APK_LIST=$(gh release view "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --json assets \
            --jq '.assets[].name | select(endswith(".apk"))')

          MANAGER_FILE=$(echo "$APK_LIST" | grep -i "manager" | head -n 1)

          if [ -z "$MANAGER_FILE" ]; then
            echo "Warning: 'manager' apk not found by name, falling back to first .apk"
            MANAGER_FILE=$(echo "$APK_LIST" | head -n 1)
          fi

          if [ -z "$MANAGER_FILE" ]; then
            echo "Error: No .apk asset found in LSPatch release."
            exit 1
          fi

          echo "Selected manager apk: $MANAGER_FILE"
          gh release download "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --pattern "$MANAGER_FILE" --output "manager.apk" --clobber

          ls -lh lspatch.jar manager.apk

      # 7. パッチ適用 (Local Mode + 注入ローダーデックス)
      - name: Apply LSPatch (Local Mode)
        if: steps.check.outputs.update_needed == 'true'
        run: |
          mkdir -p output

          echo "Applying patch in Local Mode with Inject Loader Dex..."
          java -jar lspatch.jar instafel.apk --manager manager.apk --injectdex -f -o output

          echo "Files in output directory:"
          ls -lh output/

          # Instafelのパッチ済みファイルのみを特定してリネーム
          mv output/instafel-*-lspatched.apk output/instafel-patched-unsigned.apk

      # 8. 署名 (apksignerを直接使用)
      - name: Sign APK (Manual)
        if: steps.check.outputs.update_needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TOOLS_VERSION: "34.0.0"
        run: |
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          echo "Running zipalign..."
          "$BUILD_TOOLS_PATH/zipalign" -v -p 4 output/instafel-patched-unsigned.apk output/instafel-aligned.apk

          echo "Running apksigner..."
          "$BUILD_TOOLS_PATH/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out output/instafel-patched.apk \
            output/instafel-aligned.apk

          rm release.keystore

      # 9. リリース作成
      - name: Create Release
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag_name }}" \
            output/instafel-patched.apk \
            --title "Instafel Patched ${{ steps.check.outputs.tag_name }}" \
            --notes "Base: Instafel Clone (c) ${{ steps.check.outputs.tag_name }}<br>LSPatch: JingMatrix (Local Mode + Inject Dex)"
